# Default pipeline for a new problem: diagnose -> resolve -> summarize.
name: case_resolution
version: "1.0"
description: Diagnose a reported problem, plan the resolution, and reply to the customer.
default: true
priority: 100

stages:
  - id: diagnose
    agent: diagnostic
    skills:
      - skill: knowledge_base_search
        args: {query: $.message, top_k: 3}
      - skill: log_analyzer                       # only when the message carries error evidence
        args: {text: $.message}
        when: {matches: 'error|exception|fail|timeout|crash|\b[45]\d\d\b|[A-Z]{2,5}-\d{3,5}'}
      - skill: customer_lookup
        args: {text: $.message}
        when: {matches: 'CUST-\d+'}
    inputs:
      message: $.message
      customer: $.skills.customer_lookup
    on_failure:
      retries: 1
      fallback_agent: diagnostic_lite
      otherwise: abort

  - id: resolve
    agent: resolution
    when:                                         # nothing to resolve until the problem is clear
      equals: {$.stages.diagnose.needs_more_info: false}
    skills:
      - skill: knowledge_base_search
        args:
          query: {$coalesce: ["$.stages.diagnose.hypotheses[0].hypothesis", $.message]}
          top_k: 2
      - skill: escalation_policy
        args:
          severity: $.stages.diagnose.severity
          category: $.stages.diagnose.category
          customer_plan: $.stages.diagnose.customer_plan
          previous_attempts: 0
    inputs:
      message: $.message
      diagnosis: $.stages.diagnose
    on_failure:
      retries: 1
      otherwise: skip                             # the summary can still acknowledge the diagnosis

  - id: summarize
    agent: summary
    skills:
      - skill: sentiment_analyzer
        args: {text: $.message}
    inputs:
      message: $.message
      diagnosis: $.stages.diagnose
      resolution: $.stages.resolve
    on_failure:
      retries: 1
      default_output:
        status: in_progress
        customer_reply: "Thanks for the details. Your case is with our support team and we will follow up shortly."
        internal_note: "Summary agent failed; reply generated from the pipeline default."
        next_action: "Review the diagnosis and resolution findings and reply manually"
        tags: [summary_fallback]

response:
  stage: summarize
  reply_field: customer_reply
  status_field: status
