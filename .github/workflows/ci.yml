name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff lint
        run: ruff check src plugins
      - name: ruff format
        run: ruff format --check src plugins
      - name: mypy (strict)
        run: mypy src plugins
      - name: Configuration loads (agents, pipelines, skill discovery, contracts)
        run: |
          python -c "
          from orchestrator.config import get_settings
          from orchestrator.platform import load_components
          c = load_components(get_settings())
          print('pipelines', sorted(c.pipelines)); print('agents', sorted(c.agents)); print('skills', c.skills.names())
          "

  build:
    name: Build package and Docker image, smoke test
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: pip install build && python -m build --wheel
      - name: Start stack (app + Redis, mock LLM)
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test (health, auth, chat pipeline, metrics)
        run: |
          curl -fsS localhost:8000/health
          token=$(curl -fsS -X POST localhost:8000/auth/token -H 'content-type: application/json' \
            -d '{"username":"alice","password":"alice-pass"}' | jq -r .access_token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/chat \
            -H 'content-type: application/json' -d '{"message":"x"}')
          test "$code" = 401
          curl -fsS -X POST localhost:8000/api/chat -H "Authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"message":"Our API calls time out with HTTP 504 since the deploy. CUST-1042"}' > chat.json
          jq '{status, pipeline, case_status, stages: [.stages[] | {id, status}]}' chat.json
          test "$(jq -r .status chat.json)" = completed
          curl -fsS localhost:8000/metrics | grep pipeline_runs_total
      - name: Logs
        if: always()
        run: docker compose logs app | tail -n 40
      - name: Stop stack
        if: always()
        run: docker compose down -v
